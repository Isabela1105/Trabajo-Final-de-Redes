# CI del proyecto: lint + formato + tests + smoke training.
# Este workflow NO entrena la GAN completa: solo verifica que el pipeline no esté roto.
# El entrenamiento real se hace en Colab/Kaggle y se documenta en el informe.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña Actions

# Si se hacen varios pushes seguidos al mismo PR, cancela el run anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo leer el código.
permissions:
  contents: read

jobs:
  calidad:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Linter (ruff)
        run: ruff check .

      - name: Formato (black)
        run: black --check .

      - name: Pruebas unitarias
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            pytest -q --cov=src --cov-report=term-missing
          else
            echo "Sin tests todavía: se omiten hasta el primer PR de código."
          fi

      - name: Generar muestra sintética para el smoke test
        run: |
          if [ -f scripts/make_synthetic_sample.py ]; then
            python scripts/make_synthetic_sample.py --out data/sample --n 8 --size 64
          else
            echo "Falta scripts/make_synthetic_sample.py (PR-F3): se omite la muestra."
          fi

      - name: Smoke training (2 pasos, CPU)
        run: |
          if [ -f scripts/make_synthetic_sample.py ] && [ -f src/gan/train.py ]; then
            python -m src.gan.train --config configs/smoke.yaml --max-steps 2
          else
            echo "El pipeline de entrenamiento aún no existe (PR-D2): se omite el smoke."
          fi
        env:
          TF_CPP_MIN_LOG_LEVEL: "2" # silencia logs informativos de TensorFlow
          CUDA_VISIBLE_DEVICES: "-1" # fuerza CPU; el runner no tiene GPU
          PYTHONHASHSEED: "42"

      - name: Guardar artefactos del smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: outputs/smoke
          if-no-files-found: warn
          retention-days: 7

  titulo-pr:
    name: Título de PR
    # Solo aplica a pull requests; en push a main no hay título que validar.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            ci
            chore
          requireScope: false
          subjectPattern: ^[a-záéíóúñ0-9].+$
          subjectPatternError: |
            El título del PR debe empezar en minúscula y describir el cambio.
            Ejemplo: feat(model): implementar generador U-Net (#10)
