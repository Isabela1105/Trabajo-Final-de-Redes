# Entrega v1.0.0: dependencias congeladas. Límite 0 = Dependabot no abre PRs de versiones
# (las alertas de seguridad siguen activas). Subir el límite para reactivarlo.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "area:ci"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "area:ci"
