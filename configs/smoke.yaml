# Configuración mínima para tests y CI.
# Debe correr en CPU en menos de ~2 minutos.
# tests/test_smoke_train.py crea los pares sintéticos en tmp_path, sin scripts externos.

seed: 42

data:
  train_dir: data/sample/train
  val_dir: data/sample/val
  test_dir: data/sample/val
  image_size: 64
  batch_size: 2
  num_parallel_calls: 1

model:
  ngf: 8
  ndf: 8
  n_downsample: 4
  dropout: 0.5
  norm: instance
  # Builders y pérdidas reales ya mergeados en main. Los tests inyectan modelos mínimos
  # para que el smoke sea rápido; la CLI usa estos módulos reales.
  generator_builder: src.gan.models.generator:build_generator
  discriminator_builder: src.gan.models.discriminator:build_discriminator
  losses_module: src.gan.losses

train:
  allow_smoke_fallback: true
  max_to_keep: 1
  epochs: 1
  lr_g: 0.0002
  lr_d: 0.0002
  beta_1: 0.5
  beta_2: 0.999
  lambda_l1: 100.0
  label_smoothing: 0.0
  mixed_precision: false
  clip_norm: 1.0
  sample_interval: 1
  checkpoint_interval: 1
  early_stopping_patience: 1
  max_steps: 2

output:
  dir: outputs/smoke
  save_samples: true
