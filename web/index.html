<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restauración de fotografías · Pix2Pix</title>
    <link rel="stylesheet" href="/static/styles.css?v=6" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Restauración de fotografías</h1>
        <p class="sub">Pix2Pix · U-Net + PatchGAN · Redes Neuronales y Deep Learning, UAO</p>
      </div>
      <span id="status" class="badge" aria-live="polite">Comprobando modelo…</span>
    </header>

    <main>
      <section class="panel" aria-labelledby="t-subir">
        <h2 id="t-subir">1. Elige una foto degradada</h2>
        <label id="drop" class="drop" for="file">
          <input id="file" type="file" accept="image/*" />
          <span>Arrastra una imagen aquí o <u>haz clic para buscarla</u></span>
          <small>PNG, JPG o WEBP · hasta 20 MB · el modelo trabaja a 256×256</small>
        </label>
        <div id="examples-box" hidden>
          <p class="hint">o elige una foto del conjunto de prueba (incluye su original para comparar):</p>
          <div id="examples" class="examples" role="list"></div>
        </div>
        <label class="option">
          <input id="limpiar" type="checkbox" checked />
          Quitar puntos de polvo antes y después del modelo
        </label>
        <label class="option">
          <input id="nitidez" type="checkbox" />
          Realzar nitidez (se ve más definida, pero baja un poco el PSNR)
        </label>
        <button id="restore" class="primary" type="button" disabled>Restaurar</button>
        <p id="message" class="message" role="status"></p>
      </section>

      <section class="panel" aria-labelledby="t-resultado">
        <h2 id="t-resultado">2. Compara</h2>
        <p id="current" class="current" hidden></p>
        <div id="compare" class="compare">
          <figure>
            <figcaption>Entrada</figcaption>
            <div class="frame"><img id="before" alt="Imagen de entrada" /></div>
            <p id="m-before" class="metric"></p>
          </figure>
          <figure>
            <figcaption>Restaurada</figcaption>
            <div class="frame">
              <img id="after" alt="Imagen restaurada" />
              <div id="spinner" class="spinner" hidden></div>
            </div>
            <p id="m-after" class="metric"></p>
          </figure>
          <figure id="fig-original" hidden>
            <figcaption>Original (referencia)</figcaption>
            <div class="frame"><img id="original" alt="Fotografía original sin daño" /></div>
            <p class="metric muted">la foto antes del daño</p>
          </figure>
        </div>
        <p id="delta" class="delta" hidden></p>
        <a id="download" class="secondary" download="restaurada.png" hidden>Descargar PNG</a>
      </section>
    </main>

    <script src="/static/app.js?v=6"></script>
  </body>
</html>
